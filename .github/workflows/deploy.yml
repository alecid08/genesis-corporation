name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm build

      # Los dos pasos siguientes requieren el secret CLOUDFLARE_API_TOKEN
      # (permisos Workers Scripts:Edit, D1:Edit, R2:Edit, Account Settings:Read)
      # y CLOUDFLARE_ACCOUNT_ID configurados en el repo.

      # Las migraciones van ANTES del deploy: solo añaden columnas con DEFAULT,
      # así que el código viejo sigue funcionando contra el esquema nuevo. Al
      # revés no: el código nuevo contra el esquema viejo sí rompería.
      # wrangler es idempotente, solo aplica las migraciones pendientes.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply nitza-demo-platform --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
